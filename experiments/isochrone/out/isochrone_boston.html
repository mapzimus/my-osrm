<title>Drive-Time Isochrones</title>

<style>
  :root {
    --bg: #ffffff; --fg: #1d2330; --muted: #5d6677; --panel: rgba(255,255,255,0.94);
    --border: #d9dde5; --accent: #d1495b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11141a; --fg: #e8ebf1; --muted: #9aa3b5; --panel: rgba(22,26,34,0.94);
      --border: #303746; --accent: #ff7a8a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11141a; --fg: #e8ebf1; --muted: #9aa3b5; --panel: rgba(22,26,34,0.94);
    --border: #303746; --accent: #ff7a8a;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; z-index: 1000; top: 16px; left: 16px; width: 290px;
    max-width: calc(100vw - 64px); background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; box-shadow: 0 4px 18px rgba(0,0,0,.12); }
  .panel h1 { font-size: 17px; margin: 0 0 2px; }
  .panel .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
  .legend { display: grid; grid-template-columns: 18px 1fr auto; gap: 4px 8px; align-items: center;
    font-size: 13px; font-variant-numeric: tabular-nums; }
  .sw { width: 18px; height: 12px; border-radius: 2px; opacity: .8; }
  .area { color: var(--muted); font-size: 12px; text-align: right; }
  .note { color: var(--muted); font-size: 12px; margin-top: 10px; border-top: 1px solid var(--border);
    padding-top: 8px; }
  #route { margin-top: 8px; font-size: 13px; min-height: 18px; }
  .city-label { background: none; border: none; box-shadow: none; padding: 0 0 0 6px;
    font-size: 11.5px; font-weight: 600; color: #1d2330;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; }
  .city-label::before { display: none; }
  @media (max-width: 600px) {
    .panel { top: auto; bottom: 16px; left: 16px; right: 16px; width: auto; max-width: none;
      padding: 10px 12px; }
    .legend { grid-template-columns: 18px 1fr auto 18px 1fr auto; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1 id="title"></h1>
  <div class="sub">Driving time by car. US + Canada roads, ferries included.</div>
  <div class="legend" id="legend"></div>
  <div id="route">Click anywhere to route there.</div>
  <div class="note">Self-hosted OSRM, OpenStreetMap data (May 2026). Free-flow times, no traffic
    or ferry waits. Blank = more than 5 km from a mapped major road or connector.</div>
</div>

const map = L.map("map", { zoomSnap: 0.25 }).fitBounds(D.bounds);
// The container can measure 0x0 on first paint (embedded panes); re-fit once
// it has a real size, and keep the map sized to its container afterwards.
let fitted = false;
new ResizeObserver(() => {
  map.invalidateSize();
  if (!fitted && map.getSize().x > 0) { map.fitBounds(D.bounds); fitted = true; }
}).observe(document.getElementById("map"));

const esri = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas";
const attribution = 'Basemap &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors';
L.tileLayer(`${esri}/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}`,
  { attribution, maxZoom: 13 }).addTo(map);
L.imageOverlay("data:image/png;base64," + D.png, D.bounds, { interactive: false }).addTo(map);
map.createPane("labels").style.zIndex = 450;
map.getPane("labels").style.pointerEvents = "none";
L.tileLayer(`${esri}/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}`,
  { pane: "labels", maxZoom: 13 }).addTo(map);

document.getElementById("title").textContent = `How far can you drive from ${D.name}?`;
const km2ToMi2 = 0.386102;
const legend = document.getElementById("legend");
D.colors.forEach((c, i) => {
  const mi2 = Math.round(D.areas[i] * km2ToMi2 / 1000);
  legend.insertAdjacentHTML("beforeend",
    `<span class="sw" style="background:${c}"></span><span>${i + 1} h</span>` +
    `<span class="area">${mi2.toLocaleString()}k mi²</span>`);
});

L.circleMarker([D.origin[1], D.origin[0]], { radius: 7, color: "#fff", weight: 2,
  fillColor: "#d1495b", fillOpacity: 1 }).addTo(map).bindTooltip(D.name, { permanent: true,
  direction: "right", className: "city-label" });
for (const c of D.cities) {
  const label = c.hours == null ? `${c.name}: no route` : `${c.name} ${c.hours.toFixed(1)} h`;
  L.circleMarker([c.lat, c.lon], { radius: 3.5, color: "#1d2330", weight: 1,
    fillColor: "#fff", fillOpacity: 1 }).addTo(map)
    .bindTooltip(label, { permanent: true, direction: "right", className: "city-label" });
}

// Live routing: works while the local OSRM engine is running.
let routeLayer = null;
const out = document.getElementById("route");
map.on("click", async (e) => {
  const { lat, lng } = e.latlng;
  const url = `${D.url}/route/v1/driving/${D.origin[0]},${D.origin[1]};${lng.toFixed(5)},${lat.toFixed(5)}` +
    "?overview=full&geometries=geojson&steps=true";
  out.textContent = "Routing…";
  try {
    const r = await fetch(url).then((x) => x.json());
    if (r.code !== "Ok") throw new Error(r.message || r.code);
    const route = r.routes[0];
    const ferry = route.legs[0].steps.some((s) => s.mode === "ferry");
    if (routeLayer) routeLayer.remove();
    routeLayer = L.geoJSON(route.geometry, { style: { color: "#d1495b", weight: 4, opacity: 0.9 } }).addTo(map);
    out.innerHTML = `<b>${(route.duration / 3600).toFixed(1)} h</b> · ${Math.round(route.distance / 1609.344)} mi` +
      (ferry ? " · <b>uses a ferry</b>" : "");
  } catch (err) {
    out.textContent = `Routing needs the local engine (${D.url}). ${err.message}`;
  }
});
