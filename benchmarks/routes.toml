# Route report card — known trips with a known "right answer".
#
# Each case is a trip where a naive engine gets it wrong (drives around a
# ferry, refuses to enter Canada) plus a few controls that should never break.
#
# Coordinates are lon,lat (OSRM order). Thresholds are deliberately loose:
# the question is "did it take the shortcut?", not "is it accurate to the mile".
#   max_miles  — the shortcut route is under this; the detour is well over it
#   needs      — "us" (any engine) or "na" (only the US+Canada engine can pass)
#   hours      — optional [low, high] drive-time band; catches a profile that
#                is too slow (stock OSRM: DC->Boston 9.2 h) or too fast

[[case]]
name = "Grand Isle VT -> Plattsburgh NY (Lake Champlain ferry)"
kind = "ferry"
needs = "us"
from = [-73.3510, 44.7206]   # Grand Isle village
to = [-73.4529, 44.6995]     # downtown Plattsburgh
max_miles = 25               # ferry ~12 mi total; around via Rouses Pt ~55 mi
note = "Gordon Landing <-> Cumberland Head, 12-min crossing, runs 24/7"

